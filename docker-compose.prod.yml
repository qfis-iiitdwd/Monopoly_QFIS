# Production stack: the app + Caddy (automatic HTTPS). The database is Supabase (DATABASE_URL).
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
# (.env sets COMPOSE_FILE=docker-compose.prod.yml, so plain `docker compose` uses this file.)
services:
  app:
    build: .
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (Supabase session pooler connection string)}
      PORT: "3000"
      COOKIE_SECURE: "1"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_SSL: ${DB_SSL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes:
      - ./config:/app/config:ro
      - ./papers:/app/papers:ro
      - ./media:/app/media:ro
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
